<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation Dance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card-container {
            perspective: 1000px;
            width: 500px;
            height: 400px;
            position: relative;
        }

        .card {
            width: 100%;
            height: 300px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
            animation: flipIn 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes flipIn {
            0% {
                transform: rotateY(-90deg);
                opacity: 0;
            }
            100% {
                transform: rotateY(0deg);
                opacity: 1;
            }
        }

        @keyframes shine {
            0% { transform: translate(-100%, -100%) rotate(45deg); }
            100% { transform: translate(100%, 100%) rotate(45deg); }
        }

        .transformation-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            font-size: 3rem;
        }

        .fraction-line {
            width: 100%;
            height: 3px;
            background-color: #667eea;
            margin: 2px 0;
        }

        .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            transform: translateY(100%);
            transition: transform 0.5s ease-out;
        }

        .label.show {
            transform: translateY(0);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.playing {
            background: #667eea;
            color: white;
        }

        .info {
            color: white;
            margin-top: 1rem;
            font-size: 1.1rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .card-container { width: 90vw; height: 350px; }
            .card { font-size: 2.5rem; height: 250px; }
            .fraction { font-size: 2rem; }
            .label { font-size: 1.3rem; padding: 15px; }
            button { padding: 12px 24px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <h1>🎵 Transformation Dance 🎵</h1>
    
    <div class="card-container">
        <div class="card" id="transformationCard">
            <div class="transformation-content" id="transformationContent">
                (x, y)
            </div>
            <div class="label" id="transformationLabel">Identity</div>
        </div>
    </div>

    <div class="controls">
        <button id="playButton">▶ Start Dance</button>
        <button id="nextButton">⏭ Next Card</button>
    </div>

    <div class="info">
        <p id="bpmInfo">126 BPM • Cards: 8 beats | Labels: beats 5-8</p>
    </div>

    <script>
        // Base transformations with their counts for balancing
        const baseTransformations = [
            // 8 Translations (x1 = 8 total)
            { rule: '(x + h, y)', label: 'Horizontal Translation', count: 1 },
            { rule: '(x, y + k)', label: 'Vertical Translation', count: 1 },
            { rule: '(x - h, y)', label: 'Horizontal Translation', count: 1 },
            { rule: '(x, y - k)', label: 'Vertical Translation', count: 1 },
            { rule: '(x - h, y + k)', label: 'Diagonal Translation', count: 1 },
            { rule: '(x + h, y - k)', label: 'Diagonal Translation', count: 1 },
            { rule: '(x - h, y - k)', label: 'Diagonal Translation', count: 1 },
            { rule: '(x + h, y + k)', label: 'Diagonal Translation', count: 1 },
            
            // 2 Reflections (x4 = 8 total)
            { rule: '(-x, y)', label: 'Reflection over Y-axis', count: 4 },
            { rule: '(x, -y)', label: 'Reflection over X-axis', count: 4 },
            
            // 4 Rotations (x2 = 8 total)
            { rule: '(-y, x)', label: '90° Counterclockwise Rotation', count: 2 },
            { rule: '(-x, -y)', label: '180° Rotation', count: 2 },
            { rule: '(y, -x)', label: '90° Clockwise Rotation', count: 2 },
            { rule: '(x, y)', label: 'Identity', count: 2 },
            
            // 4 Dilations/Scalings (x2 = 8 total)
            { rule: '(bx, y)', label: 'Horizontal Dilation', count: 2 },
            { rule: '(x, ay)', label: 'Vertical Dilation', count: 2 },
            { rule: 'fraction-1', label: 'Horizontal Contraction', count: 2 }, // (1/b x, y)
            { rule: 'fraction-2', label: 'Vertical Contraction', count: 2 }  // (x, 1/a y)
        ];

        // Expand transformations based on count
        const transformations = [];
        baseTransformations.forEach(t => {
            for (let i = 0; i < t.count; i++) {
                transformations.push({ rule: t.rule, label: t.label });
            }
        });

        const card = document.getElementById('transformationCard');
        const transformationContent = document.getElementById('transformationContent');
        const label = document.getElementById('transformationLabel');
        const playButton = document.getElementById('playButton');
        const nextButton = document.getElementById('nextButton');
        
        let isPlaying = false;
        let cardIntervalId = null;
        let labelTimeoutId = null;
        let audioContext = null;

        const BPM = 126;
        const beatInterval = (60 / BPM) * 1000; // milliseconds per beat
        const cardChangeBeats = 8; // Change card every 8 beats
        const labelShowBeats = 4; // Show label after 4 beats
        const cardChangeInterval = beatInterval * cardChangeBeats;
        const labelShowDelay = beatInterval * labelShowBeats;

        function createFractionHTML(numerator, denominator, variable, position) {
            // position: 'first' or 'second' for x or y coordinate
            if (position === 'first') {
                return `(<div class="fraction"><span>${numerator}</span><div class="fraction-line"></div><span>${denominator}</span></div>${variable}, y)`;
            } else {
                return `(x, <div class="fraction"><span>${numerator}</span><div class="fraction-line"></div><span>${denominator}</span></div>${variable})`;
            }
        }

        function getRandomTransformation() {
            return transformations[Math.floor(Math.random() * transformations.length)];
        }

        function updateCard() {
            // Hide label first
            label.classList.remove('show');
            
            // Remove animation
            card.style.animation = 'none';
            
            // Trigger reflow
            void card.offsetWidth;
            
            // Get new transformation
            const transformation = getRandomTransformation();
            
            // Update content based on type
            if (transformation.rule === 'fraction-1') {
                // (1/b x, y)
                transformationContent.innerHTML = createFractionHTML('1', 'b', 'x', 'first');
            } else if (transformation.rule === 'fraction-2') {
                // (x, 1/a y)
                transformationContent.innerHTML = createFractionHTML('1', 'a', 'y', 'second');
            } else {
                transformationContent.textContent = transformation.rule;
            }
            
            label.textContent = transformation.label;
            
            // Re-add animation
            card.style.animation = 'flipIn 0.6s ease-out';
            
            // Show label after 4 beats
            if (labelTimeoutId) clearTimeout(labelTimeoutId);
            labelTimeoutId = setTimeout(() => {
                label.classList.add('show');
            }, labelShowDelay);
        }

        function startMusic() {
            // Create audio context for 126 BPM beat
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create a simple kick drum sound
            const kickInterval = beatInterval / 1000; // Convert to seconds
            let nextKickTime = audioContext.currentTime;

            function scheduleKick() {
                if (!isPlaying) return;

                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.connect(gain);
                gain.connect(audioContext.destination);
                
                // Kick drum parameters
                osc.frequency.setValueAtTime(150, nextKickTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, nextKickTime + 0.5);
                
                gain.gain.setValueAtTime(0.5, nextKickTime);
                gain.gain.exponentialRampToValueAtTime(0.01, nextKickTime + 0.5);
                
                osc.start(nextKickTime);
                osc.stop(nextKickTime + 0.5);
                
                nextKickTime += kickInterval;
                
                setTimeout(scheduleKick, kickInterval * 500); // Schedule next kick
            }
            
            scheduleKick();
        }

        function stopMusic() {
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        playButton.addEventListener('click', () => {
            if (!isPlaying) {
                // Start
                isPlaying = true;
                playButton.textContent = '⏸ Pause Dance';
                playButton.classList.add('playing');
                
                startMusic();
                updateCard();
                cardIntervalId = setInterval(updateCard, cardChangeInterval);
            } else {
                // Stop
                isPlaying = false;
                playButton.textContent = '▶ Start Dance';
                playButton.classList.remove('playing');
                
                stopMusic();
                clearInterval(cardIntervalId);
                if (labelTimeoutId) clearTimeout(labelTimeoutId);
            }
        });

        nextButton.addEventListener('click', () => {
            updateCard();
        });

        // Initialize with a random card
        updateCard();
    </script>
</body>
</html>
